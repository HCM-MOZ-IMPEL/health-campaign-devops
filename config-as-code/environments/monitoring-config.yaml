prometheus:
  retention: 90d
  storageSpec:
    volumeClaimTemplate:
      spec:
        storageClassName: salama-nfs
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
  alertmanager:
    enabled: true
  externalLabels:
    cluster: azure-togo-prod
  additionalScrapeConfigs:
    # - job_name: 'nginx-ingress-metrics'
    #   static_configs:
    #     - targets: [ 'release-name-ingress-nginx-controller-metrics.backbone:10254' ]
    - job_name: 'blackbox'
      metrics_path: /probe
      params:
        module: [ http_2xx ]
      static_configs:
        - targets:
            - https://alafiatogo-hcm.digit.org/jupyter/hub/
            - https://alafiatogo-hcm.digit.org/kibana-upgrade/
            - https://alafiatogo-hcm.digit.org/pgadmin/
      relabel_configs:
        - source_labels: [ __address__ ]
          target_label: __param_target
        - source_labels: [ __param_target ]
          target_label: instance
        - target_label: __address__
          replacement: prometheus-blackbox-exporter:9115
    - job_name: 'blackbox_exporter'
      static_configs:
        - targets: [ 'prometheus-blackbox-exporter:9115' ]
# <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<
