  egov-mdms-service-endpoint-key: "/mdms-v2/v1/_search"


pgadmin:
  dbUrl: "jdbc:postgresql://10.0.0.5:5432/salamadbprd"
  cpu_requests: 200m
  memory_requests: 1Gi
  cpu_limits: 300m
  memory_limits: 2Gi
  environment: "PROD"
  serverBasePath: "/pgadmin"
  persistence:
    storageClassName: salama-nfs

prometheus:
  retention: 90d
  storageSpec:
    volumeClaimTemplate:
      spec:
        storageClassName: salama-nfs
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
  alertmanager:
    enabled: true
  externalLabels:
    cluster: salama
  additionalScrapeConfigs:
    - job_name: 'nginx-ingress-metrics'
      static_configs:
        - targets: [ 'ingress-nginx-controller-metrics.backbone:10254' ]
    - job_name: 'blackbox'
      metrics_path: /probe
      params:
        module: [ http_2xx ]
      static_configs:
        - targets:
            - https://salama.misau.gov.mz/jupyter/hub/
            - https://salama.misau.gov.mz/kibana-upgrade/
            - https://salama.misau.gov.mz/pgadmin/
      relabel_configs:
        - source_labels: [ __address__ ]
          target_label: __param_target
        - source_labels: [ __param_target ]
          target_label: instance
        - target_label: __address__
          replacement: prometheus-blackbox-exporter:9115
    - job_name: 'blackbox_exporter'
      static_configs:
        - targets: [ 'prometheus-blackbox-exporter:9115' ]
loki:
  persistence:
    enabled: true
    storageClassName: salama-nfs-csi
    accessModes:
      - ReadWriteMany
    size: 150Gi
  additionalConfigs:
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem                        ## AWS s3 as storage
          schema: v11
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/index
        cache_location: /data/loki/index_cache
        shared_store: filesystem                           ## AWS s3 as storage
        cache_ttl: 72h
      # aws:
      #   s3: http://minio.default.svc.cluster.local:9000   # endpoint goes here
      #   bucketnames: loki
      #   insecure: true

    compactor:
      working_directory: /data/loki/boltdb-shipper-compactor
      shared_store: filesystem                             ## AWS s3 as storage
      retention_enabled: true
      compaction_interval: 720h                    ## compaction in hours
    table_manager:
      retention_deletes_enabled: true
      retention_period: 720h

