global:
  domain: salama.misau.gov.mz
  setup: fullsetup

cluster-configs:
  namespaces:
    create: true
    values: [ backbone, cert-manager, egov, kafka-cluster, logging, monitoring, playground, zookeeper-cluster, es-cluster-v8, jupyter ]

  root-ingress:
    cert-issuer: letsencrypt-prod
  configmaps:
    egov-config:
      data:
        db-host: "10.0.0.5" ## Add db-host name eg: egov-demo.database.azure.com
        db-name: "salamadbprd" ## Add db-name
        db-url: "jdbc:postgresql://10.0.0.5:5432/salamadbprd" ## example: jdbc:postgresql://egov-demo.postgres.database.azure.com:5432/egov_demo
        db-read-url: "jdbc:postgresql://10.0.0.6:5432/salamadbprd" ## example: jdbc:postgresql://egov-demo.postgres.database.azure.com:5432/egov_demo
        domain: "salama.misau.gov.mz" ## Add your Domain Name
        redis-host: "redis.backbone"
        redis-downsync-host: "redis.backbone"
        egov-services-fqdn-name: "https://salama.misau.gov.mz/" ## Add your Domain Name
        aws-cluster-ip: ""
        aws-region: ""
        aws-cluster-name: ""
        egov-state-level-tenant-id: "mz"
        s3-assets-bucket: "(pg-health-egov-assets|egov-health-playground-assets)"
        es-host: "elasticsearch-data.es-cluster-v8"
        es-infra-host: "elasticsearch-data-infra-v1.es-cluster-infra"
        es-indexer-host: "https://elasticsearch-data.es-cluster-v8:9200/"
        flyway-locations: "filesystem:/flyway/sql,filesystem:/flyway/seed,filesystem:/flyway/qa"
        kafka-brokers: "release-name-kafka-controller-headless.kafka-cluster:9092"
        kafka-infra-brokers: "kafka-v2-infra.kafka-cluster:9092"
        logging-level-jdbc: "DEBUG"
        mobile-validation-workaround: "true"
        serializers-timezone-in-ist: "true"
        server-tomcat-max-connections: "500"
