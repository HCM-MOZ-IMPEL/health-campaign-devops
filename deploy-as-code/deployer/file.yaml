---
# Source: workbench-ui/templates/subfilter-injection-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: workbench-ui-js-injection
  namespace: egov
data:
  sub_filter.conf: "
    sub_filter  '<head>' '<head>
    <script src=https://egov-dev-assets.s3.ap-south-1.amazonaws.com/hcm/workbenchGlobalConfigs.js type=text/javascript></script>';"
---
# Source: workbench-ui/templates/service.yaml
# service.yaml---
apiVersion: v1
kind: Service
metadata:
  name: workbench-ui
  namespace: egov  
  annotations: 
  labels:
    app: workbench-ui      
    group: web   
spec:
  selector:
    app: workbench-ui      
    group: web    
  ports:
  - name: http
    port: 80
    targetPort: 80
---
# Source: workbench-ui/templates/deployment.yaml
# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench-ui
  namespace: egov
  labels:
    app: workbench-ui      
    group: web   
spec:
  selector:
    matchLabels:
      app: workbench-ui      
      group: web
  strategy:
    rollingUpdate:
      maxUnavailable: 0     
  replicas: 1
  template:
    metadata:  
      annotations:      
        deployment-timestamp: "20241111173005"        
      labels:
        app: workbench-ui      
        group: web            
    spec:     
      volumes:
      - name: js-injection
        configMap:
          name: workbench-ui-js-injection
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: "failure-domain.beta.kubernetes.io/zone"
              labelSelector:
                matchLabels:
                  app: workbench-ui      
                  group: web     
      initContainers:            
      containers:      
        - name: workbench-ui
          image: egovio/workbench-ui:console-0132e7aa64-546
          imagePullPolicy: IfNotPresent             
          ports:
            - name: http
              containerPort: 80
              protocol: TCP              
          readinessProbe:
            httpGet:
                path: "/workbench-ui/"
                port: 80
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 5        
             
          livenessProbe:
            httpGet:
                path: "/workbench-ui/"
                port: 80
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 5
            
          lifecycle:
            preStop:
              exec:
                command:
                - sh
                - -c
                - sleep 10
          volumeMounts:
          - mountPath: /etc/nginx/conf.d/sub_filter.conf
            name: js-injection
            subPath: sub_filter.conf                                     
          resources:
---
# Source: workbench-ui/templates/ingress.yaml
# ingress.yaml---
apiVersion: networking.k8s.io/v1 
kind: Ingress
metadata:
  name: workbench-ui
  namespace: egov  
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/limit-rpm: "1200"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/lua-resty-waf: active
    nginx.ingress.kubernetes.io/lua-resty-waf-allow-unknown-content-types: "true"
    nginx.ingress.kubernetes.io/lua-resty-waf-debug: "true"
    nginx.ingress.kubernetes.io/lua-resty-waf-process-multipart-body: "false"
    nginx.ingress.kubernetes.io/lua-resty-waf-score-threshold: "10" 
  labels:
    app: workbench-ui      
    group: web                            
spec:
  rules:  
  - host: moz-health-qa.digit.org  
    http:
      paths:
      - backend:
          service:
            name: workbench-ui
            port:
              number: 80            
        path: /workbench-ui
        pathType: Prefix        
  tls:      
  - hosts:
    - moz-health-qa.digit.org
    secretName: moz-health-qa.digit.org-tls-certs

